# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out Open-Craw/VideoCraw
        uses: actions/checkout@v7
        with:
          repository: Open-Craw/VideoCraw
          path: VideoCraw
          ref: 'main'
          token: ${{ secrets.VIDEOCRAW_TOKEN }}
      - name: Export VIDEOCRAW
        shell: bash
        run: echo "VIDEOCRAW=$GITHUB_WORKSPACE/VideoCraw" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: 'clippy, rustfmt'
      - name: Cache the cargo download store
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: smith-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            smith-cargo-${{ runner.os }}-
      - name: Cache the pip download store
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: smith-pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'apps/speech-to-text/pyproject.toml') }}
          restore-keys: |
            smith-pip-${{ runner.os }}-
      - name: Install smith
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple/ monosmith==1.131.0
          smith --version
      - name: Build VideoCraw
        shell: bash
        working-directory: VideoCraw
        run: cargo build --release -p videocraw-vcw
      # smith:slot before-setup
      # smith:slot-end before-setup
      - name: Setup
        run: smith ci setup
      - name: Audit
        run: smith ci audit
      - name: Verify
        run: smith ci verify
      # smith:slot after-verify
      # smith:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: smith release --dry-run --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci pack
      - name: Keep the packed apps (dist/drop as artifact drop)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref_name == 'main'
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore
      - name: Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref_name == 'main' && hashFiles('dist/release/**') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release/*/*

  assets:
    needs: ci
    if: github.event_name == 'push' && github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: macos-x64
            os: macos-15-intel
          - platform: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out Open-Craw/VideoCraw
        uses: actions/checkout@v7
        with:
          repository: Open-Craw/VideoCraw
          path: VideoCraw
          ref: 'main'
          token: ${{ secrets.VIDEOCRAW_TOKEN }}
      - name: Export VIDEOCRAW
        shell: bash
        run: echo "VIDEOCRAW=$GITHUB_WORKSPACE/VideoCraw" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: 'clippy, rustfmt'
      - name: Install smith
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple/ monosmith==1.131.0
          smith --version
      - name: Build VideoCraw
        shell: bash
        working-directory: VideoCraw
        run: cargo build --release -p videocraw-vcw
      - name: Setup
        run: smith ci setup
      - name: Build and upload the release files
        run: smith ci assets
        env:
          SMITH_PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
