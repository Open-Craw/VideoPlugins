# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: 'clippy, rustfmt'
      - name: Cache the cargo download store
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: smith-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            smith-cargo-${{ runner.os }}-
      - name: Cache the pip download store
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: smith-pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'apps/speech-to-text/pyproject.toml') }}
          restore-keys: |
            smith-pip-${{ runner.os }}-
      - name: Install smith
        run: curl -fsSL https://raw.githubusercontent.com/monosmith-app/monosmith/main/install.sh | sh -s -- "$SMITH_VERSION"
        env:
          SMITH_VERSION: 1.63.0
          GITHUB_TOKEN: ${{ github.token }}
      # smith:slot before-setup
      # smith:slot-end before-setup
      - name: Setup
        run: smith ci setup
      - name: Audit
        run: smith ci audit
      - name: Verify
        run: smith ci verify
      # smith:slot after-verify
      # smith:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: smith release --dry-run --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci pack
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref_name == 'main'
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore
      - name: Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci release
