[package]
name = "videoplugins-onnx-device"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata.smith]
kind = "lib"

[dependencies]
ort = "=2.0.0-rc.15"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }
