[package]
name = "videoplugins-sound-reader"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata.smith]
kind = "lib"

[dependencies]
memmap2 = "0.9"
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "ogg", "vorbis", "pcm", "alac"] }
