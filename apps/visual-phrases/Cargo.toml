[package]
name = "videoplugins-visual-phrases"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata.smith]
kind = "app"

[dependencies]
ort = "=2.0.0-rc.15"
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
videoplugins-appearances = { path = "../../libs/appearances" }
videoplugins-frame-reader = { path = "../../libs/frame-reader" }
videoplugins-model-cache = { path = "../../libs/model-cache" }
videoplugins-onnx-device = { path = "../../libs/onnx-device" }
videoplugins-plugin-sdk = { path = "../../libs/plugin-sdk" }
videoplugins-work-files = { path = "../../libs/work-files" }
