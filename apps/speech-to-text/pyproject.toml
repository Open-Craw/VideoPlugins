[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videoplugins-speech-to-text"
version = "0.0.0"
description = "speech-to-text"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1,<2",
    # faster-whisper decodes with PyAV and does not work with PyAV 17 or newer yet.
    "av>=11,<17",
]

[tool.smith]
kind = "app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
